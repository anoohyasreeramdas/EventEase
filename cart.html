<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - EventEase</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body.cart-page {
      font-family: Arial, sans-serif;
      background: #F5F0E6;
      margin: 0;
      padding: 0;
      color: #30291F;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background-color: #F5F0E6;
      padding: 10px 20px;
      flex-wrap: wrap;
      color: #967A4D;
      border-bottom: 1px solid #E2D5BD;
    }

    .left-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .left-section a {
      font-weight: bold;
      color: #806A48;
      text-decoration: none;
      margin-bottom: 5px;
    }

    .left-section a:hover {
      color: #A88B58;
    }

    .left-inner {
      display: flex;
      align-items: center;
    }

    .logo {
      height: 50px;
      margin-right: 10px;
      object-fit: contain;
    }

    .logged-in {
      font-weight: bold;
      color: #30291F;
    }

    .cart-title {
      font-size: 24px;
      font-weight: bold;
      margin-top: 15px;
      color: #967A4D;
    }

    .right-section {
      margin-left: auto;
      margin-top: 15px;
    }

    #cart-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px;
      justify-content: center;
    }

    .event-card {
      background: #FBF8F1;
      border: 1px solid #E2D5BD;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(48, 41, 31, 0.08);
      width: 280px;
      text-align: center;
      padding: 15px;
      transition: transform 0.2s ease-in-out;
    }

    .event-card:hover {
      transform: scale(1.05);
    }

    .event-poster {
      width: 100%;
      border-radius: 8px;
    }

    .event-details h2 {
      margin: 10px 0;
      color: #967A4D;
    }

    .remove-btn {
      background-color: #967A4D;
      color: #FBF8F1;
      border: none;
      padding: 8px 12px;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
      transition: 0.2s;
    }

    .remove-btn:hover {
      background-color: #806A48;
    }

    .cart-summary {
      text-align: center;
      margin: 20px;
      background: #FBF8F1;
      padding: 20px;
      border: 1px solid #E2D5BD;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(48, 41, 31, 0.08);
    }

    .book-btn {
      background-color: #CBB58C;
      color: #30291F;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
      font-weight: bold;
    }

    .book-btn:hover {
      background-color: #B69A6B;
    }
  </style>
</head>

<body class="cart-page">

  <header class="page-header">
    <div class="left-section">
      <a href="index.html">← Back to Home</a>
      <div class="left-inner">
        <img src="eventease-logo.png" alt="EventEase Logo" class="logo">
        <p class="logged-in">Logged in as: <strong id="username"></strong></p>
      </div>
    </div>

    <div class="right-section">
      <h1 class="cart-title">Your Cart</h1>
    </div>
  </header>

  <main>
    <div id="cart-container">
      <!-- Cart items will be injected here -->
    </div>

    <div class="cart-summary">
      <p><strong>Total Price:</strong> ₹<span id="total-price">0</span></p>
      <button id="pay-now" class="book-btn">Proceed to Payment</button>
    </div>
  </main>

  <script src="cart.js"></script>

</body>
</html>
