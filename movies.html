<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventEase – Movies</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="movies-page">

<header class="page-header movies-header category-header">
  <a href="index.html" class="back-home">← Back to Home</a>
  <img src="eventease-logo.png" alt="EventEase Logo" class="logo">
  <h1>Movies</h1>
</header>

  <!-- Displays the available movies -->
  <section id="movie-list" class="movies-list"></section>

  <!-- Displays the booking interface after a movie is selected -->
  <section id="booking-section" class="booking hidden">
    <div class="booking-header">

      <img id="booking-poster" alt="Poster">

      <div>
        <h2 id="booking-title"></h2>

        <label>
          Show Date:
          <input type="date" id="showdate" style="padding: 5px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;">
        </label>

        <label>
          Showtime:
          <select id="showtime"></select>
        </label>
      </div>
    </div>

    <!-- Seat availability legend -->
    <div class="seat-legend">
      <span class="legend available"></span> Available
      <span class="legend selected"></span> Selected
      <span class="legend booked"></span> Booked
    </div>

    <div id="seat-container" class="seats"></div>

    <!-- Displays the booking summary and available actions -->
    <div class="summary">
      <p>Selected Seats: <span id="count">0</span></p>
      <p>Total Price: ₹<span id="total">0</span></p>
      <button id="add-to-cart" class="btn">Add to Cart</button>
      <button id="close-booking" class="btn-outline">Cancel</button>
    </div>
  </section>

  <!-- Loads movie data before the booking functionality -->
  <script src="moviesData.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {

        // Verify the user's login session before displaying the movie page.
        try {
            const sessionResponse = await fetch('http://127.0.0.1:3000/check-session', {
                credentials: 'include'
            });

            const sessionData = await sessionResponse.json();

            if (!sessionResponse.ok || !sessionData.isLoggedIn) {
                window.location.href = "login.html";
                return;
            }
        } catch (error) {
            console.error("Could not check session:", error);
            window.location.href = "login.html";
            return;
        }

        // Retrieve the elements used by the movie and booking interface.
        const movieListEl = document.getElementById('movie-list');
        const bookingSection = document.getElementById('booking-section');
        const bookingPoster = document.getElementById('booking-poster');
        const bookingTitle = document.getElementById('booking-title');
        const showdateSelect = document.getElementById('showdate');
        const showtimeSelect = document.getElementById('showtime');
        const seatContainer = document.getElementById('seat-container');
        const countEl = document.getElementById('count');
        const totalEl = document.getElementById('total');
        const addToCartBtn = document.getElementById('add-to-cart');
        const closeBookingBtn = document.getElementById('close-booking');

        const ROWS = 8;
        const COLS = 10;

        let currentMovie = null;
        let selectedSeats = new Set();
        let bookedSeats = [];

        // Display all available movies.
        renderMovieGrid(MOVIES);

        function renderMovieGrid(movies) {
            movieListEl.innerHTML = movies.map(movie => `
                <div class="movie-card" data-id="${movie.id}">
                    <img src="${movie.poster}" alt="${movie.title}">
                    <h3>${movie.title}</h3>
                    <p>From ₹${movie.price}</p>
                    <button class="btn book-btn" data-id="${movie.id}">Book</button>
                </div>
            `).join('');

            movieListEl.addEventListener('click', (event) => {
                const button = event.target.closest('.book-btn');

                if (!button) return;

                openBooking(Number(button.dataset.id));
            });
        }

        // Open the booking interface for the selected movie.
        function openBooking(movieId) {
            currentMovie = MOVIES.find(movie => movie.id === movieId);

            if (!currentMovie) return;

            bookingPoster.src = currentMovie.poster;
            bookingTitle.textContent = currentMovie.title;

            // Set the current local date as the default and prevent past dates.
            const now = new Date();
            const today = [
                now.getFullYear(),
                String(now.getMonth() + 1).padStart(2, '0'),
                String(now.getDate()).padStart(2, '0')
            ].join('-');

            showdateSelect.value = today;
            showdateSelect.min = today;

            showtimeSelect.innerHTML = currentMovie.showtimes
                .map(time => `<option value="${time}">${time}</option>`)
                .join('');

            selectedSeats.clear();
            updateBookedSeatsFromStorage();
            renderSeatMap();
            updateSummary();

            bookingSection.classList.remove('hidden');
            scrollToSection(bookingSection);
        }

        // Retrieve previously selected seats for the chosen show.
        function updateBookedSeatsFromStorage() {
            const key = bookedSeatsKey();
            bookedSeats = JSON.parse(localStorage.getItem(key)) || [];
        }

        // Create a separate storage key for each movie, date and showtime.
        function bookedSeatsKey() {
            const showtime = showtimeSelect.value || currentMovie.showtimes[0];
            const showdate = showdateSelect.value;

            return `booked_${currentMovie.id}_${showdate}_${showtime}`;
        }

        // Generate the seating layout and update seat availability.
        function renderSeatMap() {
            seatContainer.innerHTML = '';

            for (let i = 0; i < ROWS * COLS; i++) {
                const seat = document.createElement('div');

                seat.className = 'seat';

                if (bookedSeats.includes(i)) {
                    seat.classList.add('booked');
                }

                if (selectedSeats.has(i)) {
                    seat.classList.add('selected');
                }

                seat.dataset.index = i;
                seatContainer.appendChild(seat);
            }

            seatContainer.onclick = (event) => {
                const seat = event.target.closest('.seat');

                if (!seat || seat.classList.contains('booked')) return;

                const seatIndex = Number(seat.dataset.index);

                if (selectedSeats.has(seatIndex)) {
                    selectedSeats.delete(seatIndex);
                } else {
                    selectedSeats.add(seatIndex);
                }

                updateSummary();
                renderSeatMap();
            };

            // Refresh seat availability when the date or showtime changes.
            const onSelectionChange = () => {
                selectedSeats.clear();
                updateBookedSeatsFromStorage();
                renderSeatMap();
                updateSummary();
            };

            showtimeSelect.onchange = onSelectionChange;
            showdateSelect.onchange = onSelectionChange;
        }

        // Update the selected seat count and total booking price.
        function updateSummary() {
            countEl.textContent = selectedSeats.size;
            totalEl.textContent = selectedSeats.size * currentMovie.price;
        }

        // Validate the selection and add the booking to the user's cart.
        addToCartBtn.onclick = async () => {
            const showdate = showdateSelect.value;

            if (!currentMovie || selectedSeats.size === 0) {
                alert('Please select at least one seat.');
                return;
            }

            if (!showdate) {
                alert('Please select a show date.');
                return;
            }

            const bookingDetails = {
                title: currentMovie.title,
                poster: currentMovie.poster,
                price: selectedSeats.size * currentMovie.price,
                place: `Seats: ${Array.from(selectedSeats).join(', ')}`,
                time: showtimeSelect.value,
                date: showdate
            };

            try {
                const response = await fetch('http://127.0.0.1:3000/cart', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(bookingDetails)
                });

                const result = await response.json();

                if (response.ok) {
                    const key = bookedSeatsKey();
                    const alreadyBooked = JSON.parse(localStorage.getItem(key)) || [];

                    const newBooked = [
                        ...new Set([
                            ...alreadyBooked,
                            ...Array.from(selectedSeats)
                        ])
                    ];

                    localStorage.setItem(key, JSON.stringify(newBooked));

                    alert('Successfully added to cart!');
                    window.location.href = "cart.html";
                } else {
                    alert(`Error: ${result.message}`);
                }

            } catch (error) {
                console.error('Failed to add to cart:', error);
                alert('Could not connect to the server.');
            }
        };

        // Close the booking interface and clear the current selection.
        closeBookingBtn.onclick = () => {
            bookingSection.classList.add('hidden');
            currentMovie = null;
            selectedSeats.clear();
        };

        // Scroll smoothly to the selected booking section.
        function scrollToSection(element) {
            element.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }
    });
  </script>
</body>
</html>
