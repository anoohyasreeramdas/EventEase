<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EventEase</title>

  <style>
    :root {
      --primary: #967A4D;
      --secondary: #B69A6B;
      --bg: #F5F0E6;
      --text: #30291F;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--bg);
      margin: 0;
    }

    .login-box {
      background: #FBF8F1;
      padding: 30px;
      border: 1px solid #E2D5BD;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 6px 18px rgba(48, 41, 31, 0.10);
    }

    .login-box img {
      width: 90px;
      margin-bottom: 15px;
      object-fit: contain;
    }

    h2 {
      margin-bottom: 15px;
      color: var(--primary);
    }

    /* Password visibility control */
    .input-wrapper {
      position: relative;
      width: 100%;
      margin: 10px 0;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      background: transparent;
      border: none;
      color: #806A48;
      cursor: pointer;
      width: auto;
      border-radius: 4px;
    }

    .toggle-password:hover {
      background: transparent;
      color: #A88B58;
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .input-wrapper input {
      padding-right: 40px;
      margin: 0;
    }

    input {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: 1px solid #E2D5BD;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      background: #FFFFFF;
      color: #30291F;
      transition: border 0.2s ease-in-out;
    }

    input:focus {
      border: 1px solid var(--secondary);
      box-shadow: 0 0 5px rgba(182, 154, 107, 0.3);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #FBF8F1;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s ease-in-out;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    button:hover {
      background: var(--secondary);
    }

    p {
      margin-top: 15px;
      color: var(--text);
      font-size: 14px;
    }

    a {
      color: #806A48;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      color: #A88B58;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <img src="eventease-logo.png" alt="EventEase Logo">

    <h2>Login</h2>

    <!-- User authentication inputs -->
    <input
      type="text"
      id="username"
      placeholder="Enter Username"
      autocomplete="username"
      required
    >

    <div class="input-wrapper">
      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        autocomplete="current-password"
        required
      >

      <button type="button" class="toggle-password" id="toggle-password" aria-label="Show password">
        <svg id="eye-icon" viewBox="0 0 24 24">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <button id="login-btn">Login</button>

    <p id="error-message" style="color: var(--secondary); margin-top: 10px; font-weight: bold; min-height: 20px;"></p>

    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:3000';

    const loginBtn = document.getElementById("login-btn");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");
    const eyeIcon = document.getElementById("eye-icon");
    const errorMessage = document.getElementById("error-message");

    // Toggle password visibility.
    function changePasswordVisibility() {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';

      if (isPassword) {
        eyeIcon.innerHTML = `
          <path d="M3 3l18 18"></path>
          <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
          <path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.5 0 10 7 10 7a15.5 15.5 0 0 1-4 4.8"></path>
          <path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.1 0 2.1-.2 3-.5"></path>
        `;
        togglePassword.setAttribute('aria-label', 'Hide password');
      } else {
        eyeIcon.innerHTML = `
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
        togglePassword.setAttribute('aria-label', 'Show password');
      }
    }

    togglePassword.addEventListener('click', changePasswordVisibility);

    togglePassword.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        changePasswordVisibility();
      }
    });

    // Submit login credentials.
    loginBtn.addEventListener("click", async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      errorMessage.textContent = '';

      if (!username || !password) {
        errorMessage.textContent = "Please enter both username and password.";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        const response = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = "index.html";
        } else {
          errorMessage.textContent = data.message || "Login failed. Please check your credentials.";
        }
      } catch (error) {
        console.error('Login failed:', error);
        errorMessage.textContent = "Could not connect to the server. Please try again later.";
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
